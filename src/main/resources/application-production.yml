# PRODUCTION profile — activate with: --spring.profiles.active=production
# Requires explicit CORS origins and HTTPS termination at reverse proxy.

spring:
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
        path: /

# Production CORS origins must be set explicitly via env var.
# No default — if unset, no cross-origin requests are allowed.
# Example: CAMPUS_GUINNESS_SECURITY_CORS_ALLOWED_ORIGINS=https://frontend.example.com

logging:
  level:
    root: WARN
    com.campusguinness: INFO
