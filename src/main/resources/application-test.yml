spring:
  datasource:
    url: jdbc:tc:postgresql:18.4:///test_db
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  sql:
    init:
      mode: never

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

logging:
  level:
    root: WARN

campus-guinness:
  security:
    login-lockout:
      enabled: true
      failure-threshold: 3
      lock-duration: 10m
      reset-failures-on-success: true

testcontainers:
  ryuk:
    disabled: true
