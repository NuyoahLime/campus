spring:
  application:
    name: campus-guinness

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campus_guinness}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  sql:
    init:
      mode: never

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 30m

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: false
        same-site: lax
        path: /
      tracking-modes: cookie
      persistent: false

  security:
    user:
      name: unused
      password: unused

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.campusguinness: DEBUG

app:
  auth:
    email-verification-ttl: PT24H
    password-reset-ttl: PT30M
  mail:
    from: ${MAIL_FROM:no-reply@campus-guinness.local}
    public-frontend-url: ${PUBLIC_FRONTEND_URL:http://localhost:5173}
