forbidden_phrases:
  - 共20个
  - 毫秒或其他最小单位
  - 素材原则上必须关联活动
  - 学校暂停或停用后，授权状态自动暂停
  - 仅草稿计算状态且无关联版本的排行榜可物理删除
  - 超管审核 → 平台公开
  - "版本号升级至v1.1；无业务规则变更"
  - "## 3.X"
  - 是否允许小数

