name: Stage26 Full E2E

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage26-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-e2e:
    name: Browser and API E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Display tool versions
        shell: bash
        run: |
          set -euo pipefail
          java -version
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify startup-failure cleanup
        working-directory: frontend
        run: npm run e2e:startup-cleanup

      - name: Verify failed authenticated tests do not create traces
        working-directory: frontend
        run: npm run e2e:trace-guard

      - name: Run Stage26 Full E2E
        working-directory: frontend
        run: npm run e2e

      - name: Verify Stage26 evidence artifact safety
        if: always()
        working-directory: frontend
        run: npm run e2e:artifact-guard

      - name: Upload Stage26 E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage26-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/**
            frontend/test-results/stage26-e2e-junit.xml
          if-no-files-found: ignore
          retention-days: 14
