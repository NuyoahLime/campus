name: Onboarding Release Gate
on:
  push:
    branches: [fix/account-onboarding-release-gate]
  workflow_dispatch:
jobs:
  verify:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: campus_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: 'maven' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: docker version
      - run: cd frontend && npm ci && npm run lint && npm run type-check && npm run test -- --run && npm run build
      - run: mvn --batch-mode --no-transfer-progress -DforkCount=1 -DreuseForks=false clean verify
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
